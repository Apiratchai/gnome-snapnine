# Shared pipeline: unit tests, syntax check, zip.  Runs on every push
# and PR; nightly and release reuse it via workflow_call, optionally
# pinned to a branch with the `ref` input.
name: ci
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      - name: install gjs
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gjs

      - name: unit
        run: make unit

      - name: syntax
        run: |
          for f in *.js; do
            cp "$f" "/tmp/${f%.js}.mjs"
            node --check "/tmp/${f%.js}.mjs"
          done

      - name: zip
        run: make zip

      - uses: actions/upload-artifact@v4
        with:
          name: snapnine
          path: snapnine.zip
