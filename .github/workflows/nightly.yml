# SPDX-License-Identifier: GPL-2.0-or-later
# Rolling prerelease, cut on a cadence (daily) or on demand, not on
# every push: shipping every push is not how release channels behave.
# Builds the nightly branch head and publishes it as the fixed-name
# `rolling` prerelease; the tag moves to the built SHA and unchanged
# nightlies are skipped.
name: nightly
on:
  schedule:
    - cron: '0 6 * * *'   # daily, 06:00 UTC
  workflow_dispatch:

# gh release create/upload needs write access.
permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml
    with:
      ref: nightly

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snapnine

      - name: rename
        run: mv snapnine.zip snapnine-nightly.zip

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          SHA="$(gh api repos/$GH_REPO/commits/nightly --jq .sha)"
          LAST="$(gh api repos/$GH_REPO/releases/tags/rolling --jq .target_commitish 2>/dev/null || echo '')"
          if [ -n "$LAST" ] && [ "$LAST" = "$SHA" ]; then
            echo "nightly unchanged at ${SHA:0:10}; skipping publish"
            exit 0
          fi
          # Recreate at the nightly head; the fixed release name keeps
          # the download URL stable while --target moves the tag.
          gh release delete rolling --cleanup-tag --yes 2>/dev/null || true
          gh release create rolling --target "$SHA" --prerelease --title nightly \
            --notes "Automated build of the nightly branch @ ${SHA:0:10}."
          gh release upload rolling snapnine-nightly.zip
