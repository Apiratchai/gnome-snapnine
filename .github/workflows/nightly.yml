# SPDX-License-Identifier: GPL-2.0-or-later
# Rolling prerelease: every push to nightly rebuilds the zip and moves
# the nightly tag forward.  Manual dispatch for convenience.
name: nightly
on:
  push:
    branches: [nightly]
  workflow_dispatch:

# gh release create/upload needs write access.
permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snapnine

      - name: rename
        run: mv snapnine.zip snapnine-nightly.zip

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Tag is "rolling", not "nightly": a tag sharing the branch
          # name makes local ref resolution ambiguous, and it should
          # mark the exact commit this zip was built from anyway.
          gh release view rolling >/dev/null 2>&1 \
            || gh release create rolling \
                 --target "$GITHUB_SHA" \
                 --prerelease --title nightly \
                 --notes "Automated build of the nightly branch."
          # drop the pre-rename asset so it does not linger
          gh release delete-asset rolling snapnine.zip --yes 2>/dev/null || true
          gh release upload rolling snapnine-nightly.zip --clobber
