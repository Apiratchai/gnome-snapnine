# Manual release from main.  Bump metadata.json version first, then
# run this with a tag name.
name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'release tag, e.g. v14'
        required: true

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: snapnine

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${{ inputs.tag }}" snapnine.zip \
            --title "${{ inputs.tag }}" \
            --generate-notes --latest
